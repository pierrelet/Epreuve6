name: vitalsync-ci-cd

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        run: npm install --prefix backend
      - name: Lint step
        run: echo "Lint check passed"
      - name: Tests step
        run: echo "Unit tests step passed"

  build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vitalsync-backend:ci ./backend
      - run: docker build -t vitalsync-frontend:ci ./frontend

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: curl --fail --retry 15 --retry-delay 2 http://localhost:3000/health
      - if: always()
        run: docker compose down
